# CB Assets — nginx site (HTTPS only; port 80 redirects).
# Placeholders are filled in by deploy/install.sh.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certificate renewal (certbot webroot) must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Keep the TLS listener compatible with older nginx packages.
    # HTTP/2 is intentionally not enabled because its directive syntax varies
    # between nginx releases; HTTPS itself remains fully enabled.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    # Security headers (the app also sets its own)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Self-hosted backend (accounts + data API) running in Docker on this VM.
    location ~ ^/+(auth|rest)/v1/ {
        rewrite ^/+(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Recover requests produced by older builds that stored a bare host and
    # consequently called /<host>/auth/v1/* instead of /auth/v1/*.
    location ~ ^/[^/]+/(auth|rest)/v1/ {
        rewrite ^/[^/]+/(auth|rest)/v1/(.*)$ /$1/v1/$2 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # CMDB REST API (GLPI + ServiceNow dialects) served by the Flask service.
    location /api/public/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
