# Single entry point for the self-hosted backend, mirroring the hosted API shape:
#   /auth/v1/*  -> GoTrue (accounts, sign-in, admin user management)
#   /rest/v1/*  -> PostgREST (the Data API used by the app and the Flask backend)
server {
    listen 8000;
    server_name _;
    client_max_body_size 20m;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
