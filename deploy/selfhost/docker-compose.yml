# CB Assets — self-contained backend stack (PostgreSQL + Auth + Data API).
#
#   bundled  DB_MODE: PostgreSQL 16 runs here (profile "bundled")
#   existing DB_MODE: the db service stays off and a host-network relay lets
#                     the container services reach local or remote PostgreSQL
#
# Values come from deploy/selfhost/.env (created by deploy/selfhost/up.sh).
name: cb-assets

services:
  db:
    image: postgres:16-alpine
    profiles: ["bundled"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - shared_buffers=256MB
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Host port only for local admin access; container services use db:5432.
    # The installer reserves host port 5432 for this bundled database.
    ports:
      - "127.0.0.1:${DB_BUNDLED_PORT:-5432}:5432"

  # Existing databases are reached through a host-network relay. This also
  # works when PostgreSQL listens only on 127.0.0.1, which containers cannot
  # access directly through the Docker bridge.
  # Relay for an existing PostgreSQL. It sits on the compose network (not the
  # host network) so the other services reach it container-to-container; a
  # host-published relay port is easily blocked by the VM firewall, which shows
  # up as a dial timeout inside the accounts service.
  db-proxy:
    image: alpine/socat:1.8.0.3
    profiles: ["existing"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - TCP-LISTEN:5432,fork,reuseaddr
      - TCP:${DB_TARGET_HOST:-host.docker.internal}:${DB_PORT:-5432}

  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL},${PUBLIC_URL}/*
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${DB_HOST_FOR_CONTAINERS:-db}:${DB_PORT_FOR_CONTAINERS:-5432}/${DB_NAME:-postgres}?search_path=auth&sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Google sign-in (optional): set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
      # in deploy/selfhost/.env to enable it.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "${GOOGLE_ENABLED:-false}"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
      GOTRUE_LOG_LEVEL: info
    # Keep this port local to the VM. up.sh probes the real HTTP endpoint here,
    # rather than mistaking old auth tables for a healthy accounts service.
    ports:
      - "127.0.0.1:9999:9999"

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${DB_HOST_FOR_CONTAINERS:-db}:${DB_PORT_FOR_CONTAINERS:-5432}/${DB_NAME:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db-data:
